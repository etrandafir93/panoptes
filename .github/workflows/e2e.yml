name: e2e report

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build dependencies
        run: ./mvnw -B -ntp install -pl test-tracer-core,test-tracer-junit5,test-tracer-spring-boot-starter,test-tracer-maven-plugin -am -DskipTests

      - name: Run e2e and generate report
        # testFailureIgnore=true is set in the module pom, so this always exits 0
        run: ./mvnw -B -ntp verify -pl test-tracer-e2e

      - name: Upload panoptes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panoptes-report
          path: test-tracer-e2e/target/test-tracer/site/
          if-no-files-found: warn
          retention-days: 30
